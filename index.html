<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Plane</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.4 system-ui,
          sans-serif;
      }
      body {
        margin: 24px;
        max-width: 460px;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 16px;
        margin-top: 28px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      label span {
        flex: 1;
      }
      small {
        opacity: 0.6;
      }
      label,
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      }
      .row span {
        flex: 1;
      }
      form {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      input[type='text'] {
        flex: 1;
        font: inherit;
        padding: 8px;
      }
      button {
        font: inherit;
        padding: 8px 12px;
      }
      input[type='checkbox'] {
        width: 22px;
        height: 22px;
      }
    </style>
  </head>
  <body>
    <main id="app"><p>Starting…</p></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
